name: Monorepo CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # Job 1: Test and Build the Client
  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client # Tells GitHub to run commands in the client folder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Build Client
        run: npm run build

  # Job 2: Test and Build the Server
  server-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server # Tells GitHub to run commands in the server folder

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Linter
        run: npm run lint

      - name: Build Server
        run: npm run build
